<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="laserBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EAE0"/>
      <stop offset="0.6" stop-color="#E7D9CB"/>
      <stop offset="1" stop-color="#D8C6B7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="laserBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="laserGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#laserBg)"/>
  <ellipse cx="250" cy="150" rx="330" ry="240" fill="#FFF9F1" opacity="0.55" filter="url(#laserBlur)"/>
  <g stroke="url(#beam)" stroke-width="3" opacity="0.9">
    <line x1="470" y1="40" x2="500" y2="560"/>
    <line x1="520" y1="40" x2="548" y2="540"/>
    <line x1="570" y1="40" x2="596" y2="520"/>
    <line x1="620" y1="40" x2="644" y2="500"/>
  </g>
  <g fill="none" stroke="#1A4228" stroke-opacity="0.32" stroke-linecap="round">
    <path d="M170 520 C 260 430, 292 322, 336 214 C 356 166, 392 132, 448 124" stroke-width="2.2"/>
    <path d="M206 540 C 292 448, 330 340, 372 236" stroke-width="1" stroke-opacity="0.18"/>
  </g>
  <circle cx="448" cy="124" r="7" fill="#1A4228" fill-opacity="0.3"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1">
    <circle cx="160" cy="470" r="120"/>
    <circle cx="160" cy="470" r="172"/>
  </g>
  <rect width="800" height="600" filter="url(#laserGrain)" opacity="0.7" style="mix-blend-mode:multiply"/>
</svg>
